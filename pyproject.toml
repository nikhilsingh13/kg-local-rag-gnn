[project]
name = "kg-local-rag-gnn"
version = "0.1.0"
description = "Knowledge Graph RAG for GNN Research Papers with DuckDB Semantic Caching"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pymupdf>=1.25",
    "sentence-transformers>=3.4",
    "duckdb>=1.2",
    "networkx>=3.4",
    "huggingface-hub>=0.29",
    "transformers>=4.50",
    "gradio>=5.0",
    "python-dotenv>=1.0",
    "pydantic>=2.10",
    "tqdm>=4.67",
    "pyvis>=0.3",
    "matplotlib>=3.10",
    "ruff>=0.11",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "gliner>=0.2.25",
    "pyyaml>=6.0.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
